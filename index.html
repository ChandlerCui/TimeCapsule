<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCapsule · 时光胶囊</title>
    <meta http-equiv="refresh" content="0; url=pages/diary-list.html">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        html, body { margin: 0; height: 100%; }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 14px;
            color: var(--brand-primary);
            font-size: 15px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--brand-primary);
            animation: softPulse 1.4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="dot"></div>
        <span>正在打开 TimeCapsule…</span>
    </div>
    <noscript>
        <p style="text-align:center;padding:40px 20px;color:var(--brand-muted-foreground);">
            TimeCapsule 需要启用 JavaScript 才能使用。
            <a href="pages/diary-list.html" style="color:var(--brand-primary);">点击此处直接进入日记列表</a>
        </p>
    </noscript>
    <script>
        window.location.replace('pages/diary-list.html');
    </script>
</body>
</html>
