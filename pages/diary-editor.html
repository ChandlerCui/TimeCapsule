<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCapsule · 写日记</title>
    <link rel="stylesheet" href="../css/theme.css">
    <style>
      /* --- 顶部应用栏 --- */
      .app-bar {
        position: sticky; top: 0; z-index: 50;
        background: color-mix(in srgb, var(--brand-card) 85%, transparent);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        backdrop-filter: blur(18px) saturate(180%);
        border-bottom: 1px solid var(--brand-border);
      }
      .app-bar-inner {
        max-width: 980px; margin: 0 auto; padding: 10px 20px;
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      }
      .app-bar-back {
        justify-self: start; display: inline-flex; align-items: center; gap: 2px;
        margin-left: -8px; padding: 7px 10px; border: 0; border-radius: 999px;
        background: transparent; color: var(--brand-primary);
        font-size: 15px; font-weight: 500; cursor: pointer;
        transition: background 0.3s ease;
      }
      .app-bar-back svg { width: 18px; height: 18px; }
      .app-bar-back:hover { background: var(--brand-primary-soft); }
      .app-bar-brand { justify-self: center; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; color: var(--brand-foreground); }
      .app-bar-save {
        justify-self: end; padding: 7px 18px; border: 0; border-radius: 999px;
        background: var(--brand-primary); color: #fff;
        font-size: 14px; font-weight: 600; cursor: pointer;
        box-shadow: var(--brand-shadow-card);
        transition: background 0.3s ease, transform 0.2s ease;
      }
      .app-bar-save:hover { background: var(--brand-primary-hover); }
      .app-bar-save:active { transform: scale(0.96); }

      /* --- 编辑页壳 --- */
      .editor-page { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
      .editor-card { padding: 24px 26px 26px; }

      /* --- 日期行 --- */
      .editor-date-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .editor-date { font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--brand-foreground); }

      /* --- 天气选择 --- */
      .weather-seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .weather-seg button {
        padding: 5px 14px; border: 1px solid var(--brand-border); border-radius: 999px;
        background: var(--brand-card); font-size: 13px; line-height: 1.2; color: var(--brand-ink-2);
        cursor: pointer; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
      }
      .weather-seg button:hover { color: var(--brand-foreground); border-color: var(--brand-ink-3); }
      .weather-seg button:active { transform: scale(0.96); }
      .weather-seg button.seg-active {
        background: var(--brand-primary-soft); border-color: var(--brand-primary-soft-2);
        color: var(--brand-primary); font-weight: 600; box-shadow: var(--brand-shadow-card);
      }

      /* --- 情绪选择 --- */
      .mood-row { margin-top: 16px; }
      .mood-label { font-size: 14px; font-weight: 600; color: var(--brand-ink-2); margin-bottom: 10px; }
      .mood-seg { display: flex; flex-wrap: wrap; gap: 8px; }
      .mood-chip {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 6px 14px; border: 1px solid var(--brand-border); border-radius: 999px;
        background: var(--brand-card); font-size: 13px; color: var(--brand-ink-2);
        cursor: pointer; transition: all 0.3s ease;
      }
      .mood-chip:hover { border-color: var(--brand-ink-3); transform: translateY(-1px); }
      .mood-chip.seg-active {
        border-color: transparent; color: #fff; font-weight: 600;
        box-shadow: 0 2px 8px -2px rgba(0,0,0,0.15);
      }
      .mood-chip .emoji { font-size: 15px; }

      /* --- 分隔线 --- */
      .editor-divider { margin: 18px 0 0; }

      /* --- 标题输入 --- */
      .editor-title {
        display: block; width: 100%; margin-top: 18px; padding: 4px 0;
        border: 0; background: transparent; font-size: 24px; font-weight: 700;
        line-height: 1.35; color: var(--brand-foreground); outline: none;
      }
      .editor-title::placeholder { color: var(--brand-ink-3); }

      /* --- 标签输入 --- */
      .tag-input-row { margin-top: 6px; }
      .editor-tags {
        display: block; width: 100%; padding: 4px 0;
        border: 0; background: transparent; font-size: 13px;
        color: var(--brand-ink-2); outline: none;
      }
      .editor-tags::placeholder { color: var(--brand-ink-3); }

      /* --- 字数统计 --- */
      .editor-wordcount { margin-top: 8px; text-align: right; font-size: 12px; color: var(--brand-ink-3); font-variant-numeric: tabular-nums; }

      /* --- 格式工具条 --- */
      .format-toolbar {
        display: flex; align-items: center; gap: 2px; margin-top: 12px; padding: 4px;
        width: fit-content; max-width: 100%; background: var(--brand-seg); border-radius: 10px;
      }
      .format-toolbar button {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border: 0; border-radius: 7px;
        background: transparent; color: var(--brand-ink-2); cursor: pointer;
        transition: background 0.3s ease, color 0.3s ease;
      }
      .format-toolbar button:hover { background: var(--brand-card); color: var(--brand-foreground); }
      .format-toolbar svg { width: 16px; height: 16px; }

      /* --- 正文编辑区 --- */
      .editor-body {
        position: relative; margin-top: 14px; min-height: 168px;
        font-size: 16px; line-height: 1.7; color: var(--brand-foreground); outline: none;
      }
      .editor-body:empty::before {
        content: attr(data-placeholder); display: block; color: var(--brand-ink-3); pointer-events: none;
      }
      .editor-body h3 { margin: 14px 0 8px; font-size: 18px; font-weight: 700; color: var(--brand-foreground); line-height: 1.4; }
      .editor-body blockquote {
        margin: 10px 0; padding: 8px 14px;
        border-left: 3px solid var(--brand-primary);
        background: var(--brand-primary-soft);
        border-radius: 0 var(--brand-radius-sm) var(--brand-radius-sm) 0;
        color: var(--brand-ink-2);
      }
      .editor-body ul, .editor-body ol { margin: 8px 0; padding-left: 24px; }
      .editor-body img { display: block; max-width: 100%; margin: 8px 0; border-radius: var(--brand-radius-md); }

      /* --- 图片卡片区 --- */
      .image-cards { display: grid; gap: 18px; margin-top: 20px; }
      .image-card { margin: 0; }
      .image-frame {
        position: relative; overflow: hidden; border-radius: var(--brand-radius-lg); background: var(--brand-muted);
      }
      .image-frame img {
        display: block; width: 100%; max-height: 420px; object-fit: cover;
        border-radius: var(--brand-radius-lg); cursor: zoom-in; transition: transform 0.4s ease;
      }
      .image-frame img.rotate-90 { transform: rotate(90deg); }
      .image-frame img.rotate-180 { transform: rotate(180deg); }
      .image-frame img.rotate-270 { transform: rotate(270deg); }
      .image-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
      .image-action {
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; border: 1px solid var(--brand-border); border-radius: 999px;
        background: var(--brand-card); color: var(--brand-ink-2);
        box-shadow: var(--brand-shadow-float); cursor: pointer;
        transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
      }
      .image-action:hover { background: var(--brand-primary-soft); color: var(--brand-primary); transform: translateY(-1px); }
      .image-action:active { transform: scale(0.94); }
      .image-action-danger { color: rgba(229, 57, 53, 1); }
      .image-action-danger:hover { background: rgba(229, 57, 53, 0.08); color: rgba(229, 57, 53, 1); }
      .image-action svg { width: 15px; height: 15px; }
      .image-hint {
        position: absolute; right: 10px; bottom: 10px; padding: 4px 10px;
        border-radius: 999px; font-size: 11px; color: var(--brand-card);
        background: color-mix(in srgb, var(--brand-foreground) 38%, transparent); pointer-events: none;
      }
      .image-caption {
        display: block; width: 100%; margin-top: 10px; padding: 6px 2px;
        border: 0; background: transparent; font-size: 13px; line-height: 1.5;
        color: var(--brand-ink-2); outline: none; transition: box-shadow 0.3s ease;
      }
      .image-caption::placeholder { color: var(--brand-ink-3); }
      .image-caption:focus-visible { box-shadow: 0 0 0 2px var(--brand-ring); }

      /* --- 添加图片按钮 --- */
      .insert-image {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        width: 100%; margin-top: 18px; padding: 22px 16px;
        border: 1.5px dashed var(--brand-border); border-radius: var(--brand-radius-lg);
        background: var(--brand-card); color: var(--brand-ink-2); cursor: pointer;
        transition: background 0.3s ease, border-color 0.3s ease;
      }
      .insert-image:hover { background: var(--brand-primary-soft); border-color: color-mix(in srgb, var(--brand-primary) 40%, var(--brand-border)); }
      .insert-image svg { width: 20px; height: 20px; }
      .insert-image-title { font-size: 14px; font-weight: 600; color: var(--brand-foreground); }
      .insert-image-note { font-size: 12px; color: var(--brand-ink-3); }

      /* --- 音频卡片区 --- */
      .audio-cards { display: grid; gap: 12px; margin-top: 20px; }
      .audio-card {
        display: flex; align-items: center; gap: 12px; padding: 14px 16px;
        background: var(--brand-accent-blue-soft); border: 1px solid var(--brand-accent-blue-soft-2);
        border-radius: var(--brand-radius-md);
      }
      .audio-card-icon {
        flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border-radius: 999px;
        background: var(--brand-accent-blue); color: #fff;
      }
      .audio-card-icon svg { width: 20px; height: 20px; }
      .audio-card-body { flex: 1; min-width: 0; }
      .audio-card-name { font-size: 14px; font-weight: 500; color: var(--brand-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .audio-card-time { font-size: 12px; color: var(--brand-ink-2); margin-top: 2px; }
      .audio-card audio { width: 100%; max-width: 240px; height: 32px; }
      .audio-card-delete {
        flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border: 0; border-radius: 999px;
        background: transparent; color: var(--brand-ink-2); cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .audio-card-delete:hover { background: rgba(229, 57, 53, 0.1); color: rgba(229, 57, 53, 1); }
      .audio-card-delete svg { width: 16px; height: 16px; }

      /* --- 录音/上传音频按钮 --- */
      .audio-actions-row { display: flex; gap: 12px; margin-top: 18px; }
      .btn-audio {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
        padding: 12px 16px; border: 1.5px dashed var(--brand-border); border-radius: var(--brand-radius-lg);
        background: var(--brand-card); color: var(--brand-ink-2); cursor: pointer;
        font-size: 14px; font-weight: 500; transition: background 0.3s ease, border-color 0.3s ease;
      }
      .btn-audio:hover { background: var(--brand-accent-blue-soft); border-color: var(--brand-accent-blue); }
      .btn-audio svg { width: 18px; height: 18px; }
      .btn-record.is-recording {
        background: rgba(229, 57, 53, 0.08); border-color: rgba(229, 57, 53, 0.4); color: rgba(229, 57, 53, 1);
        animation: recordPulse 1.5s ease-in-out infinite;
      }
      @keyframes recordPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.2); }
        50% { box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
      }

      /* --- 大图预览 --- */
      .lightbox {
        position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
        padding: 24px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .lightbox.is-open { opacity: 1; visibility: visible; }
      .lightbox-backdrop { position: absolute; inset: 0; background: rgba(15, 20, 30, 0.72); }
      .lightbox-body { position: relative; max-width: 92vw; max-height: 88vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .lightbox-body img { max-width: 92vw; max-height: 80vh; border-radius: var(--brand-radius-lg); box-shadow: var(--brand-shadow-float); }
      .lightbox-body figcaption { font-size: 13px; color: rgba(255, 255, 255, 0.85); }

      /* --- 底部操作栏 --- */
      .action-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
      .btn-delete {
        padding: 10px 6px; border: 0; border-radius: 8px; background: transparent;
        font-size: 15px; color: rgba(229, 57, 53, 1); cursor: pointer; transition: background 0.2s ease;
      }
      .btn-delete:hover { background: rgba(229, 57, 53, 0.08); }
      .action-bar-right { display: flex; align-items: center; gap: 10px; }
      .btn-secondary {
        padding: 9px 24px; border: 1px solid var(--brand-border); border-radius: 999px;
        background: var(--brand-card); color: var(--brand-foreground); font-size: 14px; cursor: pointer;
        transition: background 0.3s ease, transform 0.2s ease;
      }
      .btn-secondary:hover { background: var(--brand-seg); }
      .btn-secondary:active { transform: scale(0.96); }
      .btn-primary {
        padding: 9px 28px; border: 0; border-radius: 999px;
        background: var(--brand-primary); color: #fff; font-size: 14px; font-weight: 600;
        cursor: pointer; box-shadow: var(--brand-shadow-card);
        transition: background 0.3s ease, transform 0.2s ease;
      }
      .btn-primary:hover { background: var(--brand-primary-hover); }
      .btn-primary:active { transform: scale(0.96); }
      .btn-export {
        display: inline-flex; align-items: center; gap: 7px; padding: 9px 20px;
        color: var(--brand-primary); border-color: color-mix(in srgb, var(--brand-primary) 36%, var(--brand-border));
      }
      .btn-export svg { width: 16px; height: 16px; }
      .btn-export:hover { background: var(--brand-primary-soft); }
      .btn-export:disabled { opacity: 0.6; cursor: wait; transform: none; }

      /* --- PDF 导出排版（A4 · 794px 画布，供 html2pdf 渲染） --- */
      #pdf-export-root {
        position: absolute; top: 0; left: 0; z-index: -1;
        width: 794px; background: #ffffff;
        opacity: 0; pointer-events: none;
      }
      .pdf-doc {
        width: 794px; box-sizing: border-box; padding: 46px 52px 40px;
        background: #ffffff; color: #2d2836;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .pdf-brand { display: block; margin-bottom: 34px; font-size: 11px; letter-spacing: 1.5px; color: #8e82a8; }
      .pdf-brand b { font-weight: 700; color: #7a6ba0; }
      .pdf-brand span { float: right; color: #b1a9c2; letter-spacing: 0.5px; }
      .pdf-title {
        margin: 0 0 14px; font-size: 27px; line-height: 1.4; font-weight: 700; color: #241f2e;
        word-break: break-word;
      }
      .pdf-meta { display: block; font-size: 12.5px; line-height: 1.6; color: #8b8398; }
      .pdf-meta i {
        display: inline-block; font-style: normal; margin-right: 14px; white-space: nowrap;
      }
      .pdf-rule {
        height: 3px; margin: 20px 0 24px; border-radius: 2px;
        background: linear-gradient(90deg, #b8a9d4 0%, #d9c8ea 55%, #f0cfd8 100%);
      }
      .pdf-body { font-size: 15px; line-height: 1.95; color: #3a3444; word-break: break-word; }
      .pdf-body p { margin: 0 0 14px; }
      .pdf-body p:last-child { margin-bottom: 0; }
      .pdf-body b, .pdf-body strong { font-weight: 700; color: #241f2e; }
      .pdf-body i, .pdf-body em { font-style: italic; }
      .pdf-body ul, .pdf-body ol { margin: 0 0 14px; padding-left: 26px; }
      .pdf-body li { margin-bottom: 6px; }
      .pdf-body img { display: block; max-width: 100%; margin: 10px 0 14px; border-radius: 10px; }
      .pdf-img-card { margin: 20px 0 22px; page-break-inside: avoid; break-inside: avoid; }
      .pdf-img-wrap {
        text-align: center; overflow: hidden; border-radius: 12px; background: #f6f3f9;
        line-height: 0;
      }
      .pdf-img-wrap img {
        display: inline-block; max-width: 100%; max-height: 500px; border-radius: 12px;
      }
      .pdf-img-wrap img.rot-90 { transform: rotate(90deg); max-width: 62%; }
      .pdf-img-wrap img.rot-180 { transform: rotate(180deg); }
      .pdf-img-wrap img.rot-270 { transform: rotate(270deg); max-width: 62%; }
      .pdf-img-cap { margin-top: 9px; font-size: 12px; line-height: 1.6; color: #a39bb4; text-align: center; }
      .pdf-audios { margin-top: 22px; }
      .pdf-audio-card {
        display: inline-block; margin: 0 8px 8px 0; padding: 8px 16px;
        border: 1px solid #e6def2; border-radius: 999px; background: #faf8fd;
        font-size: 12px; color: #7a6ba0; page-break-inside: avoid; break-inside: avoid;
      }
      .pdf-foot {
        margin-top: 34px; padding-top: 14px; border-top: 1px solid #efeaf6;
        font-size: 11px; color: #b8b1c6; text-align: center; letter-spacing: 0.5px;
      }

      /* --- 打印回退：屏幕隐藏，仅打印时输出排版节点 --- */
      #pdf-export-root.pdf-print-mode { display: none; }
      @media print {
        body > main { display: none !important; }
        body { background: #fff !important; }
        #pdf-export-root { display: block !important; position: static !important; left: 0 !important; z-index: auto !important; }
        .pdf-doc { width: 100%; padding: 0; }
      }

      /* --- 页脚 --- */
      .page-footer { margin-top: 34px; padding: 0 16px 40px; text-align: center; }
      .page-footer p { font-size: 12px; line-height: 1.6; color: var(--brand-ink-3); }

      /* --- 响应式 --- */
      @media (max-width: 767.98px) {
        .app-bar-inner { padding: 10px 12px; gap: 8px; }
        .editor-page { padding: 16px 12px 80px; }
        .editor-card { padding: 18px 16px 20px; }
        .editor-title { font-size: 22px; }
        .editor-date-row { flex-direction: column; align-items: flex-start; gap: 10px; }
        .image-frame img { max-height: 300px; }
        .action-bar { flex-direction: column; align-items: stretch; gap: 12px; }
        .action-bar-right { justify-content: flex-end; }
        .audio-actions-row { flex-direction: column; }
        .audio-card audio { max-width: 160px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
      }
    </style>
</head>
<body>
<main>
    <header class="app-bar">
        <div class="app-bar-inner">
            <button type="button" class="app-bar-back" id="back-list" aria-label="返回列表">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                <span>返回</span>
            </button>
            <span class="app-bar-brand">TimeCapsule</span>
            <div class="app-bar-actions">
                <button type="button" class="btn-theme" id="btn-theme" aria-label="切换深浅主题" title="切换深浅主题">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
                <button type="button" class="app-bar-save" id="save-top" aria-label="保存日记">保存</button>
            </div>
        </div>
    </header>

    <div class="editor-page">
        <section id="editor-shell" class="editor-card ios-card-raised" aria-label="日记编辑器">
            <div class="editor-date-row">
                <span class="editor-date" id="editor-date"></span>
                <div class="weather-seg" role="radiogroup" aria-label="选择天气">
                    <button type="button" class="seg-active" role="radio" aria-checked="true" data-weather="晴">晴</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="多云">多云</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="阴">阴</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="小雨">小雨</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="雷阵雨">雷阵雨</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="雪">雪</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="大风">大风</button>
                    <button type="button" role="radio" aria-checked="false" data-weather="雾">雾</button>
                </div>
            </div>

            <div class="mood-row">
                <div class="mood-label">今天的心情</div>
                <div class="mood-seg" id="mood-seg" role="radiogroup" aria-label="选择心情"></div>
            </div>

            <hr class="divider-h editor-divider">

            <input id="editor-title" class="editor-title" type="text" placeholder="标题" aria-label="日记标题" autocomplete="off">

            <div class="tag-input-row">
                <input id="editor-tags" class="editor-tags" type="text" placeholder="添加标签，用逗号分隔（如：工作, 心情, 旅行）" aria-label="日记标签" autocomplete="off">
            </div>

            <div class="format-toolbar" role="toolbar" aria-label="文本格式工具">
                <button type="button" data-fmt="bold" title="加粗" aria-label="加粗"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg></button>
                <button type="button" data-fmt="italic" title="斜体" aria-label="斜体"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></svg></button>
                <button type="button" data-fmt="list" title="列表" aria-label="列表"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg></button>
                <button type="button" data-fmt="h2" title="小标题" aria-label="小标题"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6v12"/><path d="M4 12h7"/><path d="M11 6v12"/><path d="M15 6h5"/><path d="M20 6v12"/><path d="M15 12h5"/></svg></button>
                <button type="button" data-fmt="quote" title="引用" aria-label="引用"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg></button>
                <button type="button" data-fmt="image" title="插入图片" aria-label="插入图片"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
            </div>

            <div id="editor-body" class="editor-body" contenteditable="true" data-placeholder="写点什么吧…" aria-label="日记正文"></div>

            <div class="editor-wordcount"><span id="word-count">0 字</span></div>

            <hr class="divider-h editor-divider">

            <div id="image-cards" class="image-cards" aria-label="日记图片"></div>

            <button type="button" class="insert-image" id="insert-image" aria-label="添加图片">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
                <span class="insert-image-title">添加图片</span>
                <span class="insert-image-note">支持 JPG / PNG，最多 9 张</span>
            </button>

            <div id="audio-cards" class="audio-cards" aria-label="日记录音"></div>

            <div class="audio-actions-row">
                <button type="button" class="btn-audio btn-record" id="btn-record" aria-label="开始录音">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
                    <span id="record-label">开始录音</span>
                </button>
                <button type="button" class="btn-audio" id="btn-upload-audio" aria-label="上传音频文件">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
                    <span>上传音频</span>
                </button>
            </div>
        </section>

        <div class="action-bar">
            <button type="button" class="btn-delete" id="delete-entry">删除日记</button>
            <div class="action-bar-right">
                <button type="button" class="btn-secondary btn-export" id="export-pdf" aria-label="导出为 PDF 文件">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    <span id="export-label">导出 PDF</span>
                </button>
                <button type="button" class="btn-secondary btn-export" id="share-image" aria-label="分享图片">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
                    <span>分享图片</span>
                </button>
                <button type="button" class="btn-secondary" id="cancel-entry">取消</button>
                <button type="button" class="btn-primary" id="save-bottom">保存</button>
            </div>
        </div>

        <footer class="page-footer">
            <p>© 2026 TimeCapsule · 记录每一个平凡瞬间</p>
        </footer>
    </div>

    <input type="file" id="image-input" accept="image/*" multiple hidden>
    <input type="file" id="audio-input" accept="audio/*" hidden>
</main>
<script src="../js/app.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var dateEl = $('#editor-date');
  var titleInput = $('#editor-title');
  var bodyEditable = $('#editor-body');
  var imageCards = $('#image-cards');
  var audioCards = $('#audio-cards');
  var imageInput = $('#image-input');
  var audioInput = $('#audio-input');
  var insertBtn = $('#insert-image');
  var toolbarBtns = $$('.format-toolbar button');
  var weatherBtns = $$('.weather-seg button');
  var moodSeg = $('#mood-seg');
  var saveBtns = [$('#save-top'), $('#save-bottom')];
  var backBtn = $('#back-list');
  var deleteBtn = $('#delete-entry');
  var cancelBtn = $('#cancel-entry');
  var recordBtn = $('#btn-record');
  var recordLabel = $('#record-label');
  var uploadAudioBtn = $('#btn-upload-audio');

  var dateISO = null;
  var weatherLabel = '晴';
  var moodKey = 'calm';
  var pendingInsert = 'cards';

  /* --- 主题 --- */
  TC.initTheme();
  var themeBtn = $('#btn-theme');
  if (themeBtn) { themeBtn.addEventListener('click', function () { TC.toggleTheme(); }); }

  /* --- 标签 --- */
  var tagsInput = $('#editor-tags');

  /* --- 字数统计 --- */
  var wordCountEl = $('#word-count');
  function updateWordCount() {
    if (!wordCountEl) { return; }
    var text = bodyEditable.innerText || '';
    var words = text.replace(/\s+/g, '').length;
    wordCountEl.textContent = words + ' 字';
  }

  /* --- 草稿自动保存 --- */
  var DRAFT_KEY = 'timecapsule-draft';
  function currentDraftId() {
    return isNew ? 'new' : (dateISO || '');
  }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY + ':' + currentDraftId()); } catch (err) { /* ignore */ }
    try { localStorage.removeItem(DRAFT_KEY + ':' + '_meta'); } catch (err) { /* ignore */ }
  }

  function readDraft() {
    if (!dateISO) { return null; }
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY + ':' + currentDraftId()) || 'null'); } catch (err) { return null; }
  }

  function saveDraft() {
    if (!dateISO) { return; }
    try {
      var draft = {
        title: titleInput.value,
        body: bodyEditable.innerHTML,
        weather: weatherLabel,
        mood: moodKey,
        tags: tagsInput.value,
        savedAt: Date.now()
      };
      localStorage.setItem(DRAFT_KEY + ':' + currentDraftId(), JSON.stringify(draft));
      localStorage.setItem(DRAFT_KEY + ':' + '_meta', JSON.stringify({ id: currentDraftId(), savedAt: draft.savedAt }));
    } catch (err) { /* ignore */ }
  }

  function restoreDraft() {
    var d = readDraft();
    if (!d) { return; }
    if (d.title != null) { titleInput.value = d.title; }
    if (d.body != null) { bodyEditable.innerHTML = d.body; }
    if (d.tags != null) { tagsInput.value = d.tags; }
    if (d.weather) {
      weatherLabel = d.weather;
      weatherBtns.forEach(function (b) {
        b.classList.remove('seg-active');
        b.setAttribute('aria-checked', 'false');
        if (b.getAttribute('data-weather') === d.weather) { b.classList.add('seg-active'); b.setAttribute('aria-checked', 'true'); }
      });
    }
    if (d.mood) {
      moodKey = d.mood;
      moodSeg.querySelectorAll('.mood-chip').forEach(function (c) {
        c.classList.remove('seg-active');
        c.style.background = '';
        c.setAttribute('aria-checked', 'false');
        if (c.getAttribute('data-mood') === moodKey) {
          c.classList.add('seg-active');
          var m = TC.MOOD_MAP[moodKey];
          if (m) { c.style.background = m.color; }
          c.setAttribute('aria-checked', 'true');
        }
      });
    }
    updateWordCount();
  }

  /* 整理标签：逗号/空格分隔、去重、去空 */
  function parseTags(str) {
    var arr = String(str || '').split(/[,，]/).map(function (t) { return t.trim(); });
    var seen = {}, out = [];
    arr.forEach(function (t) {
      if (t && !seen[t]) { seen[t] = true; out.push(t); }
    });
    return out;
  }

  /* --- 渲染情绪选择器 --- */
  TC.MOODS.forEach(function (m) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'mood-chip' + (m.key === moodKey ? ' seg-active' : '');
    chip.setAttribute('role', 'radio');
    chip.setAttribute('aria-checked', m.key === moodKey ? 'true' : 'false');
    chip.setAttribute('data-mood', m.key);
    chip.innerHTML = '<span class="emoji">' + m.emoji + '</span><span>' + m.label + '</span>';
    if (m.key === moodKey) { chip.style.background = m.color; }
    chip.addEventListener('click', function () {
      moodKey = m.key;
      moodSeg.querySelectorAll('.mood-chip').forEach(function (c) {
        c.classList.remove('seg-active');
        c.style.background = '';
        c.setAttribute('aria-checked', 'false');
      });
      chip.classList.add('seg-active');
      chip.style.background = m.color;
      chip.setAttribute('aria-checked', 'true');
      saveDraft();
    });
    moodSeg.appendChild(chip);
  });

  /* --- 预填 --- */
  var isNew = new URLSearchParams(window.location.search).get('new') === '1';
  var opened = null;
  try { opened = JSON.parse(sessionStorage.getItem('timecapsule:opened-entry') || 'null'); } catch (err) { opened = null; }

  if (isNew) {
    titleInput.value = '';
    bodyEditable.innerHTML = '';
    imageCards.innerHTML = '';
    audioCards.innerHTML = '';
  } else if (opened && opened.dateISO) {
    var full = TC.findEntry(opened.dateISO);
    if (full) {
      dateISO = full.dateISO;
      titleInput.value = full.title || '';
      bodyEditable.innerHTML = full.body || '';
      weatherLabel = full.weather || '晴';
      moodKey = full.mood || 'calm';
      weatherBtns.forEach(function (b) {
        b.classList.remove('seg-active');
        b.setAttribute('aria-checked', 'false');
        if (b.getAttribute('data-weather') === weatherLabel) { b.classList.add('seg-active'); b.setAttribute('aria-checked', 'true'); }
      });
      moodSeg.querySelectorAll('.mood-chip').forEach(function (c) {
        c.classList.remove('seg-active');
        c.style.background = '';
        c.setAttribute('aria-checked', 'false');
        if (c.getAttribute('data-mood') === moodKey) {
          c.classList.add('seg-active');
          var m = TC.MOOD_MAP[moodKey];
          if (m) { c.style.background = m.color; }
          c.setAttribute('aria-checked', 'true');
        }
      });
      (full.images || []).forEach(function (im) {
        if (im && im.src) { imageCards.appendChild(createImageCard(im.src, im.caption || '', im.rotate || 0)); }
      });
      (full.audios || []).forEach(function (au) {
        if (au && au.src) { audioCards.appendChild(createAudioCard(au.src, au.name || '录音', au.duration || 0)); }
      });
      if (Array.isArray(full.tags)) { tagsInput.value = full.tags.join(', '); }
    }
  }

  if (!dateISO) { dateISO = TC.makeNowISO(); }
  dateEl.textContent = TC.makeLabel(dateISO);

  /* 恢复上次未保存的草稿 */
  restoreDraft();
  updateWordCount();

  /* --- 天气选择 --- */
  weatherBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      weatherLabel = btn.getAttribute('data-weather') || '晴';
      weatherBtns.forEach(function (b) { b.classList.remove('seg-active'); b.setAttribute('aria-checked', 'false'); });
      btn.classList.add('seg-active'); btn.setAttribute('aria-checked', 'true');
      saveDraft();
    });
  });

  /* --- 正文 --- */
  bodyEditable.addEventListener('input', function () {
    if (bodyEditable.innerText.trim() === '') { bodyEditable.innerHTML = ''; }
    updateWordCount();
    saveDraft();
  });

  /* --- 标题 / 标签 自动保存 --- */
  titleInput.addEventListener('input', saveDraft);
  tagsInput.addEventListener('input', saveDraft);

  /* --- 关闭/离开时兜底保存草稿 --- */
  window.addEventListener('beforeunload', saveDraft);
  window.addEventListener('pagehide', saveDraft);

  /* --- 格式工具条 --- */
  toolbarBtns.forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function () {
      bodyEditable.focus();
      var fmt = btn.getAttribute('data-fmt');
      if (fmt === 'bold') { document.execCommand('bold'); }
      else if (fmt === 'italic') { document.execCommand('italic'); }
      else if (fmt === 'h2') { document.execCommand('formatBlock', false, 'h3'); }
      else if (fmt === 'quote') { document.execCommand('formatBlock', false, 'blockquote'); }
      else if (fmt === 'list') { document.execCommand('insertUnorderedList'); }
      else if (fmt === 'image') { pendingInsert = 'inline'; imageInput.click(); }
      saveDraft();
    });
  });

  /* --- 图片压缩 --- */
  var MAX_EDGE = 1280;
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL('image/jpeg', 0.8));
        } catch (err) { cb(reader.result); }
      };
      img.onerror = function () { cb(reader.result); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function createImageCard(src, caption, rotate) {
    var fig = document.createElement('figure');
    fig.className = 'image-card';
    fig.setAttribute('data-rotate', String(rotate || 0));
    fig.innerHTML =
      '<div class="image-frame">' +
        '<img src="' + src + '" alt="日记图片" tabindex="0">' +
        '<span class="image-hint">轻点图片预览 · 可旋转删除</span>' +
        '<div class="image-actions">' +
          '<button type="button" class="image-action" data-action="rotate" title="旋转" aria-label="旋转图片"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>' +
          '<button type="button" class="image-action image-action-danger" data-action="delete" title="删除" aria-label="删除图片"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
        '</div>' +
      '</div>' +
      '<input type="text" class="image-caption" placeholder="添加图片说明…" aria-label="图片说明" autocomplete="off">';
    if (caption) { var cap = fig.querySelector('.image-caption'); if (cap) { cap.value = caption; } }
    applyRotate(fig, parseInt(fig.getAttribute('data-rotate') || '0', 10));
    return fig;
  }

  function applyRotate(card, step) {
    var img = card.querySelector('.image-frame img');
    if (!img) { return; }
    card.setAttribute('data-rotate', String(step % 4));
    img.classList.remove('rotate-90', 'rotate-180', 'rotate-270');
    if (step % 4 === 1) { img.classList.add('rotate-90'); }
    else if (step % 4 === 2) { img.classList.add('rotate-180'); }
    else if (step % 4 === 3) { img.classList.add('rotate-270'); }
  }

  function cardCount() { return imageCards.querySelectorAll('.image-card').length; }

  insertBtn.addEventListener('click', function () {
    if (cardCount() >= 9) { TC.showToast('最多添加 9 张图片'); return; }
    pendingInsert = 'cards';
    imageInput.click();
  });

  imageInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(imageInput.files || []);
    if (!files.length) { return; }
    if (pendingInsert === 'inline') {
      compressImage(files[0], function (dataUrl) {
        bodyEditable.focus();
        document.execCommand('insertImage', false, dataUrl);
        TC.showToast('已插入图片');
      });
    } else {
      var room = 9 - cardCount();
      var toAdd = files.slice(0, room);
      toAdd.forEach(function (file, idx) {
        compressImage(file, function (dataUrl) {
          imageCards.appendChild(createImageCard(dataUrl, ''));
        });
      });
      if (files.length > room) { TC.showToast('最多 9 张图片，已忽略多余图片'); }
    }
    imageInput.value = '';
  });

  imageCards.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
    if (btn && imageCards.contains(btn)) {
      var card = btn.closest('.image-card');
      if (!card) { return; }
      if (btn.getAttribute('data-action') === 'rotate') {
        applyRotate(card, (parseInt(card.getAttribute('data-rotate') || '0', 10) + 1) % 4);
      } else if (btn.getAttribute('data-action') === 'delete') {
        card.remove();
        TC.showToast('已删除图片');
      }
      return;
    }
    var img = e.target && e.target.closest ? e.target.closest('.image-frame img') : null;
    if (img && imageCards.contains(img)) { openLightbox(img.getAttribute('src')); }
  });

  /* --- 大图预览 --- */
  var lightboxEl = null;
  function openLightbox(src) {
    if (!src) { return; }
    if (!lightboxEl) {
      lightboxEl = document.createElement('div');
      lightboxEl.className = 'lightbox';
      lightboxEl.innerHTML = '<div class="lightbox-backdrop"></div><figure class="lightbox-body"><img src="" alt="图片预览"><figcaption>点击任意处关闭</figcaption></figure>';
      document.body.appendChild(lightboxEl);
      lightboxEl.addEventListener('click', closeLightbox);
    }
    lightboxEl.querySelector('img').src = src;
    lightboxEl.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    if (!lightboxEl) { return; }
    lightboxEl.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  /* --- 音频录制 --- */
  var mediaRecorder = null;
  var audioChunks = [];
  var isRecording = false;
  var recordTimer = null;
  var recordSeconds = 0;

  recordBtn.addEventListener('click', function () {
    if (isRecording) { stopRecording(); } else { startRecording(); }
  });

  function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      TC.showToast('当前浏览器不支持录音功能');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.addEventListener('dataavailable', function (e) {
        if (e.data.size > 0) { audioChunks.push(e.data); }
      });
      mediaRecorder.addEventListener('stop', function () {
        var blob = new Blob(audioChunks, { type: 'audio/webm' });
        var reader = new FileReader();
        reader.onload = function () {
          var duration = recordSeconds;
          audioCards.appendChild(createAudioCard(reader.result, '录音 ' + TC.pad2(Math.floor(duration / 60)) + ':' + TC.pad2(duration % 60), duration));
          TC.showToast('录音已添加');
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(function (t) { t.stop(); });
      });
      mediaRecorder.start();
      isRecording = true;
      recordSeconds = 0;
      recordBtn.classList.add('is-recording');
      recordLabel.textContent = '停止录音 (00:00)';
      recordTimer = setInterval(function () {
        recordSeconds++;
        recordLabel.textContent = '停止录音 (' + TC.pad2(Math.floor(recordSeconds / 60)) + ':' + TC.pad2(recordSeconds % 60) + ')';
      }, 1000);
    }).catch(function (err) {
      TC.showToast('无法访问麦克风：' + (err.message || '请检查权限'));
    });
  }

  function stopRecording() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') { return; }
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.classList.remove('is-recording');
    recordLabel.textContent = '开始录音';
    if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
  }

  /* --- 上传音频文件 --- */
  uploadAudioBtn.addEventListener('click', function () { audioInput.click(); });

  audioInput.addEventListener('change', function () {
    var file = (audioInput.files || [])[0];
    if (!file) { return; }
    if (file.size > 5 * 1024 * 1024) { TC.showToast('音频文件过大（限 5MB）'); audioInput.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function () {
      var name = file.name.replace(/\.[^.]+$/, '');
      audioCards.appendChild(createAudioCard(reader.result, name, 0));
      TC.showToast('音频已添加');
    };
    reader.readAsDataURL(file);
    audioInput.value = '';
  });

  /* --- 创建音频卡片 --- */
  function createAudioCard(src, name, duration) {
    var div = document.createElement('div');
    div.className = 'audio-card';
    div.setAttribute('data-src', src);
    var durStr = duration > 0 ? TC.pad2(Math.floor(duration / 60)) + ':' + TC.pad2(duration % 60) : '';
    div.innerHTML =
      '<div class="audio-card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></div>' +
      '<div class="audio-card-body">' +
        '<div class="audio-card-name">' + TC.escapeAttr(name) + '</div>' +
        (durStr ? '<div class="audio-card-time">时长 ' + durStr + '</div>' : '') +
      '</div>' +
      '<audio controls src="' + src + '"></audio>' +
      '<button type="button" class="audio-card-delete" data-action="delete-audio" title="删除" aria-label="删除音频"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
    return div;
  }

  audioCards.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-action="delete-audio"]') : null;
    if (btn && audioCards.contains(btn)) {
      btn.closest('.audio-card').remove();
      TC.showToast('已删除音频');
    }
  });

  /* --- 保存 --- */
  function collectEntry() {
    var images = $$('.image-card', imageCards).map(function (card) {
      var img = card.querySelector('.image-frame img');
      var cap = card.querySelector('.image-caption');
      return {
        src: img ? img.getAttribute('src') : '',
        caption: cap ? cap.value : '',
        rotate: parseInt(card.getAttribute('data-rotate') || '0', 10)
      };
    });
    var audios = $$('.audio-card', audioCards).map(function (card) {
      var nameEl = card.querySelector('.audio-card-name');
      var timeEl = card.querySelector('.audio-card-time');
      return {
        src: card.getAttribute('data-src') || '',
        name: nameEl ? nameEl.textContent : '录音',
        duration: timeEl ? parseInt((timeEl.textContent.match(/\d+/) || [0])[0], 10) : 0
      };
    });
    return {
      dateISO: dateISO,
      date: TC.makeLabel(dateISO),
      weather: weatherLabel,
      mood: moodKey,
      title: titleInput.value.trim(),
      body: bodyEditable.innerHTML.trim(),
      tags: parseTags(tagsInput.value),
      images: images,
      audios: audios
    };
  }

  function saveEntry() {
    var entry = collectEntry();
    if (!entry.title && !TC.plainText(entry.body)) {
      TC.showToast('请输入标题或正文');
      return;
    }
    try {
      TC.saveEntry(entry);
      clearDraft();
      TC.showToast('已保存');
      setTimeout(function () { window.location.href = 'diary-list.html'; }, 500);
    } catch (err) {
      if (err && (err.name === 'QuotaExceededError' || err.name === 'NS_ERROR_DOM_QUOTA_REACHED')) {
        TC.showToast('保存失败：图片或录音太多，请删减后重试');
      } else {
        TC.showToast('保存失败，请重试');
      }
    }
  }

  saveBtns.forEach(function (btn) { btn.addEventListener('click', saveEntry); });

  /* --- 导出 PDF --- */
  var exportBtn = $('#export-pdf');
  var exportLabel = $('#export-label');
  var exportingPdf = false;
  var WEATHER_EMOJI = { '晴': '☀️', '多云': '⛅', '阴': '☁️', '小雨': '🌧️', '阵雨': '🌦️', '雷阵雨': '⛈️', '雪': '❄️', '大风': '💨', '雾': '🌫️' };

  function sanitizeName(s) {
    return String(s || '').replace(/[\\/:*?"<>|\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
  }

  /* 构建 A4 排版节点（离屏挂载，供 html2pdf 渲染） */
  function buildPdfNode(entry) {
    var mood = TC.MOOD_MAP[entry.mood] || TC.MOOD_MAP.calm;
    var timeMatch = /T(\d{2}:\d{2})/.exec(entry.dateISO || '');
    var timeStr = timeMatch ? ' ' + timeMatch[1] : '';
    var now = new Date();
    var exportStamp = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';

    var html = '<div class="pdf-doc">';
    html += '<div class="pdf-brand"><b>TimeCapsule · 时光胶囊</b><span>导出于 ' + exportStamp + '</span></div>';
    html += '<h1 class="pdf-title">' + TC.escapeAttr(entry.title || '无题') + '</h1>';
    html += '<div class="pdf-meta">' +
      '<i>📅 ' + TC.escapeAttr(entry.date || '') + timeStr + '</i>' +
      '<i>' + (WEATHER_EMOJI[entry.weather] || '☁️') + ' ' + TC.escapeAttr(entry.weather || '') + '</i>' +
      '<i>' + mood.emoji + ' ' + mood.label + '</i>' +
      '</div>';
    html += '<div class="pdf-rule"></div>';
    html += '<div class="pdf-body">' + (entry.body || '') + '</div>';

    (entry.images || []).forEach(function (im) {
      if (!im || !im.src) { return; }
      var rot = ((im.rotate || 0) % 4 + 4) % 4;
      var rotCls = rot === 1 ? ' rot-90' : (rot === 2 ? ' rot-180' : (rot === 3 ? ' rot-270' : ''));
      html += '<div class="pdf-img-card">' +
        '<div class="pdf-img-wrap"><img src="' + im.src + '" alt="日记图片"' + rotCls + '></div>' +
        (im.caption ? '<div class="pdf-img-cap">' + TC.escapeAttr(im.caption) + '</div>' : '') +
        '</div>';
    });

    if ((entry.audios || []).length) {
      html += '<div class="pdf-audios">';
      (entry.audios || []).forEach(function (au) {
        if (!au || !au.name) { return; }
        html += '<span class="pdf-audio-card">♪ ' + TC.escapeAttr(au.name) + '</span>';
      });
      html += '</div>';
    }

    html += '<div class="pdf-foot">由 TimeCapsule 记录 · 数据仅保存在本机浏览器</div>';
    html += '</div>';

    var root = document.createElement('div');
    root.id = 'pdf-export-root';
    root.innerHTML = html;
    return root;
  }

  /* 等待节点内图片全部加载完成（8 秒超时保护） */
  function waitForImages(node, cb) {
    var imgs = Array.prototype.slice.call(node.querySelectorAll('img'));
    if (!imgs.length) { cb(); return; }
    var left = imgs.length;
    var done = false;
    function finish() { if (!done) { done = true; cb(); } }
    var timer = setTimeout(finish, 8000);
    function check() { left--; if (left <= 0) { clearTimeout(timer); finish(); } }
    imgs.forEach(function (img) {
      if (img.complete && img.naturalWidth > 0) { check(); }
      else {
        img.addEventListener('load', check);
        img.addEventListener('error', check);
      }
    });
  }

  /* 按需加载本地 vendor 的 html2pdf（零外网依赖，12 秒超时） */
  var pdfLibState = 'idle';
  function loadPdfLib(cb) {
    if (window.html2pdf) { pdfLibState = 'ok'; cb(true); return; }
    var settled = false;
    var script = document.createElement('script');
    script.src = '../js/vendor/html2pdf.bundle.min.js';
    var timer = setTimeout(function () {
      if (!settled) { settled = true; pdfLibState = 'error'; cb(false); }
    }, 12000);
    script.onload = function () {
      if (settled) { return; }
      settled = true; clearTimeout(timer);
      pdfLibState = window.html2pdf ? 'ok' : 'error';
      cb(pdfLibState === 'ok');
    };
    script.onerror = function () {
      if (settled) { return; }
      settled = true; clearTimeout(timer); pdfLibState = 'error'; cb(false);
    };
    document.head.appendChild(script);
  }

  function finishExport(node, msg) {
    if (node && node.parentNode) { node.parentNode.removeChild(node); }
    exportingPdf = false;
    exportBtn.disabled = false;
    exportLabel.textContent = '导出 PDF';
    if (savedScrollY !== null) { window.scrollTo(0, savedScrollY); savedScrollY = null; }
    if (msg) { TC.showToast(msg); }
  }

  /* 主路径：html2pdf 一键生成并下载 */
  var savedScrollY = null;
  function runPdfExport(node, entry, onDone, onFail) {
    var fname = '时光胶囊_' + String(entry.dateISO || '').slice(0, 10) + '_' + (sanitizeName(entry.title) || '日记') + '.pdf';
    try {
      /* html2canvas 渲染受页面滚动位置影响，先回到顶部，结束后在 finishExport 恢复 */
      savedScrollY = window.scrollY || window.pageYOffset || 0;
      if (savedScrollY > 0) { window.scrollTo(0, 0); }
      html2pdf().set({
        margin: 0,
        filename: fname,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: {
          scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false,
          onclone: function (clonedDoc) {
            var r = clonedDoc.querySelector('#pdf-export-root');
            if (r) {
              r.style.opacity = '1';
              r.style.position = 'static';
              r.style.zIndex = 'auto';
              r.style.pointerEvents = 'auto';
            }
          }
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
        pagebreak: { mode: ['css', 'legacy'], avoid: ['.pdf-img-card', '.pdf-audio-card', '.pdf-title', '.pdf-rule'] }
      }).from(node.querySelector('.pdf-doc')).save().then(function () {
        onDone();
      }).catch(function () {
        onFail();
      });
    } catch (err) {
      onFail();
    }
  }

  /* 回退路径：系统打印面板（选「存储为 PDF」） */
  function printFallback(node) {
    node.classList.add('pdf-print-mode');
    TC.showToast('已切换打印导出，请在面板选择「存储为 PDF」');
    setTimeout(function () {
      window.print();
      finishExport(node, '在打印面板选择「存储为 PDF」即可保存');
    }, 400);
  }

  exportBtn.addEventListener('click', function () {
    if (exportingPdf) { return; }
    var entry = collectEntry();
    if (!entry.title && !TC.plainText(entry.body)) {
      TC.showToast('先写点什么，再导出 PDF 吧');
      return;
    }
    exportingPdf = true;
    exportBtn.disabled = true;
    exportLabel.textContent = '生成中…';
    TC.showToast('正在排版生成 PDF…');

    var node = buildPdfNode(entry);
    document.body.appendChild(node);

    waitForImages(node, function () {
      loadPdfLib(function (ok) {
        if (ok) {
          runPdfExport(node, entry, function () {
            finishExport(node, 'PDF 已生成，正在保存到本地');
          }, function () {
            printFallback(node);
          });
        } else {
          printFallback(node);
        }
      });
    });
  });

  /* --- 返回 / 取消 / 删除 --- */
  backBtn.addEventListener('click', function () {
    window.location.href = 'diary-list.html';
  });

  cancelBtn.addEventListener('click', function () {
    window.location.href = 'diary-list.html';
  });

  deleteBtn.addEventListener('click', function () {
    TC.confirmDialog({
      title: '删除这篇日记？',
      desc: '删除后无法恢复，是否继续？',
      confirmText: '删除',
      cancelText: '取消',
      danger: true
    }).then(function (ok) {
      if (!ok) { return; }
      TC.deleteEntry(dateISO);
      clearDraft();
      TC.showToast('日记已删除');
      setTimeout(function () { window.location.href = 'diary-list.html'; }, 500);
    });
  });

  /* --- 分享图片（生成卡片并下载 PNG） --- */
  var shareImageBtn = $('#share-image');
  var WEATHER_EMOJI2 = { '晴': '☀️', '多云': '⛅', '阴': '☁️', '小雨': '🌧️', '阵雨': '🌦️', '雷阵雨': '⛈️', '雪': '❄️', '大风': '💨', '雾': '🌫️' };

  /* 简易画布文字换行 */
  function wrapText(ctx, text, maxWidth) {
    var lines = [];
    var line = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === '\n') { lines.push(line); line = ''; continue; }
      var test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line !== '') {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) { lines.push(line); }
    return lines;
  }

  function buildShareCard(entry) {
    var W = 1080, H = 1440;
    var pad = 76;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    /* 背景渐变 */
    var mood = TC.MOOD_MAP[entry.mood] || null;
    var base = mood ? mood.color : '#A593C7';
    var grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, base);
    grad.addColorStop(0.55, '#3D3744');
    grad.addColorStop(1, '#241F2E');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    /* 品牌头 */
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = '600 30px -apple-system, "PingFang SC", "Helvetica Neue", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('TimeCapsule · 时光胶囊', pad, 90);

    /* 日期 + 天气 + 心情 */
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    ctx.font = '400 30px -apple-system, "PingFang SC", sans-serif';
    var metaStr = (entry.date || '') +
      (entry.weather ? ('  ·  ' + (WEATHER_EMOJI2[entry.weather] || '') + ' ' + entry.weather) : '') +
      (mood ? ('  ·  ' + mood.emoji) : '');
    ctx.fillText(metaStr, pad, 155);

    /* 标题 */
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 56px -apple-system, "PingFang SC", sans-serif';
    var title = entry.title || '无题';
    var titleLines = wrapText(ctx, title, W - pad * 2);
    var ty = 250;
    titleLines.slice(0, 4).forEach(function (l) {
      ctx.fillText(l, pad, ty);
      ty += 72;
    });

    /* 分割线 */
    var ruleY = ty + 20;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pad, ruleY);
    ctx.lineTo(W - pad, ruleY);
    ctx.stroke();

    /* 正文（最多 18 行） */
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.font = '400 34px/1.65 -apple-system, "PingFang SC", sans-serif';
    ctx.font = '400 34px -apple-system, "PingFang SC", sans-serif';
    var plain = TC.plainText(entry.body || '');
    var bodyLines = wrapText(ctx, plain, W - pad * 2);
    var by = ruleY + 68;
    var maxLines = 18;
    var count = 0;
    bodyLines.slice(0, maxLines).forEach(function (l) { ctx.fillText(l, pad, by); by += 56; count++; });
    if (bodyLines.length > maxLines) { ctx.fillText('…', pad, by); }

    /* 标签 */
    if (entry.tags && entry.tags.length) {
      var tags = entry.tags.slice(0, 4).join('  ');
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '400 28px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText('#' + tags, pad, H - 120);
    }

    /* 底部 */
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '400 26px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('由 TimeCapsule 记录 · 即刻分享', W / 2, H - 70);

    return canvas;
  }

  if (shareImageBtn) {
    shareImageBtn.addEventListener('click', function () {
      var entry = collectEntry();
      if (!entry.title && !TC.plainText(entry.body)) {
        TC.showToast('先写点什么，再生成分享图片吧');
        return;
      }
      try {
        var canvas = buildShareCard(entry);
        var url = canvas.toDataURL('image/png');
        var a = document.createElement('a');
        var d = new Date();
        a.href = url;
        a.download = 'TimeCapsule分享_' + (entry.title ? sanitizeName(entry.title) : '日记') + '.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        TC.showToast('分享图片已生成，正在保存到本地');
      } catch (err) {
        TC.showToast('分享图片生成失败，请重试');
      }
    });
  }
})();
</script>
</body>
