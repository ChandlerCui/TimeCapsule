<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style id="theme-vars">
/* ============================================================
   TimeCapsule · iOS 简约风格主题
   主色：iOS 系统蓝 (#0A84FF) | 基底：白 + 浅蓝灰
   ============================================================ */

:root {
  /* --- 语义化 Token（apply-html-head-contract 必需映射集） --- */
  --brand-background: #f4f7fc;
  --brand-foreground: #1b1e25;
  --brand-card: #ffffff;
  --brand-card-foreground: #1b1e25;
  --brand-popover: #ffffff;
  --brand-popover-foreground: #1b1e25;
  --brand-primary: #0a84ff;
  --brand-primary-foreground: #ffffff;
  --brand-muted: #eaf1fa;
  --brand-muted-foreground: #64748b;
  --brand-border: #e4eaf3;
  --brand-input: #e4eaf3;
  --brand-ring: #0a84ff;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  /* --- 扩展的 iOS 浅色阶（同一主色相的明暗步进） --- */
  --brand-ink-2: #7a828f;
  --brand-ink-3: #a7afbc;
  --brand-primary-hover: #0071e3;
  --brand-primary-soft: #e9f3ff;
  --brand-primary-soft-2: #d9ecff;
  --brand-seg: #f0f4fa;
  --brand-divider: #edf1f7;

  /* --- 深度 --- */
  --brand-shadow-card: 0 1px 2px rgba(23, 34, 58, 0.05), 0 1px 3px rgba(23, 34, 58, 0.04);
  --brand-shadow-float: 0 12px 32px -12px rgba(23, 34, 58, 0.16);

  /* --- 字体 --- */
  --brand-font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Helvetica Neue", "Microsoft YaHei", "Segoe UI", sans-serif;
}

/* --- 基底 --- */
html,
body {
  font-family: var(--brand-font-sans);
  background-color: var(--brand-background);
  color: var(--brand-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

::selection {
  background-color: var(--brand-primary-soft-2);
  color: var(--brand-foreground);
}

/* --- 细滚动条（iOS 观感） --- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--brand-divider) transparent;
}
*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
*::-webkit-scrollbar-thumb {
  background-color: var(--brand-divider);
  border-radius: 999px;
}

/* --- 工具类：次级文字 --- */
.t-ink-2 {
  color: var(--brand-ink-2);
}
.t-ink-3 {
  color: var(--brand-ink-3);
}

/* --- 工具类：浅蓝填充 / 描边 --- */
.bg-primary-soft {
  background-color: var(--brand-primary-soft);
}
.bg-primary-soft-2 {
  background-color: var(--brand-primary-soft-2);
}
.bg-seg {
  background-color: var(--brand-seg);
}

/* --- 工具类：分隔线 --- */
.divider-h {
  height: 1px;
  background-color: var(--brand-divider);
  border: 0;
}

/* --- iOS 卡片 --- */
.ios-card {
  background-color: var(--brand-card);
  border: 1px solid var(--brand-border);
  border-radius: var(--brand-radius-lg);
}
.ios-card-raised {
  background-color: var(--brand-card);
  border: 1px solid var(--brand-border);
  border-radius: var(--brand-radius-lg);
  box-shadow: var(--brand-shadow-card);
}

/* --- 浮动层阴影（仅弹层使用） --- */
.shadow-float {
  box-shadow: var(--brand-shadow-float);
}

/* --- 减少动效 --- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

    </style>

      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;

        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

<style id="critical-layout">
/* ============================================================
   日记编辑器 · 页面布局（iOS 简约：白卡 + 浅蓝灰底 + 系统蓝）
   所有颜色均来自 --brand-* token；危险红为显式放行（tokenRelaxation）
   ============================================================ */

/* --- 顶部应用栏：sticky 毛玻璃 --- */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--brand-card) 84%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  backdrop-filter: blur(18px) saturate(180%);
  border-bottom: 1px solid var(--brand-border);
}
.app-bar-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 10px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.app-bar-back {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: -8px;
  padding: 7px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--brand-primary);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.2;
  cursor: pointer;
  transition: background 0.2s ease;
}
.app-bar-back svg.lucide { width: 18px; height: 18px; }
.app-bar-back:hover { background: var(--brand-primary-soft); }
.app-bar-back:active { background: var(--brand-primary-soft-2); }
.app-bar-back:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 2px; }
.app-bar-brand {
  justify-self: center;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--brand-foreground);
}
.app-bar-save {
  justify-self: end;
  padding: 7px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--brand-primary);
  color: var(--brand-primary-foreground);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  box-shadow: var(--brand-shadow-card);
  transition: background 0.2s ease, transform 0.15s ease;
}
.app-bar-save:hover { background: var(--brand-primary-hover); }
.app-bar-save:active { transform: scale(0.97); }
.app-bar-save:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 2px; }

/* --- 编辑页壳：max-width 980 居中 --- */
.editor-page {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 20px 24px;
}
.editor-card {
  padding: 24px 26px 26px;
}

/* --- 日期行 --- */
.editor-date-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.editor-date {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--brand-foreground);
}

/* --- 天气选择控件（iOS 流式 chip） --- */
.weather-seg {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 0;
  background: transparent;
  border-radius: 0;
}
.weather-seg button {
  padding: 5px 14px;
  border: 1px solid var(--brand-border);
  border-radius: 999px;
  background: var(--brand-card);
  font-size: 13px;
  line-height: 1.2;
  color: var(--brand-ink-2);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.weather-seg button:hover {
  color: var(--brand-foreground);
  border-color: var(--brand-ink-3);
}
.weather-seg button:active { transform: scale(0.97); }
.weather-seg button:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 2px; }
.weather-seg button.seg-active {
  background: var(--brand-primary-soft);
  border-color: var(--brand-primary-soft-2);
  color: var(--brand-primary);
  font-weight: 600;
  box-shadow: var(--brand-shadow-card);
}

/* --- 分隔线 --- */
.editor-divider { margin: 18px 0 0; }

/* --- 标题输入 --- */
.editor-title {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 4px 0;
  border: 0;
  background: transparent;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--brand-foreground);
  outline: none;
}
.editor-title::placeholder { color: var(--brand-ink-3); }
.editor-title:focus-visible {
  box-shadow: 0 0 0 2px var(--brand-ring);
  border-radius: 6px;
}

/* --- 格式工具条 --- */
.format-toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-top: 12px;
  padding: 4px;
  width: fit-content;
  max-width: 100%;
  background: var(--brand-seg);
  border-radius: 10px;
}
.format-toolbar button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--brand-ink-2);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.format-toolbar button:hover { background: var(--brand-card); color: var(--brand-foreground); }
.format-toolbar button:active { background: var(--brand-primary-soft-2); }
.format-toolbar button:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 1px; }
.format-toolbar svg.lucide { width: 16px; height: 16px; }

/* --- 正文编辑区 --- */
.editor-body {
  position: relative;
  margin-top: 14px;
  min-height: 168px;
  font-size: 16px;
  line-height: 1.7;
  color: var(--brand-foreground);
  outline: none;
}
.editor-body:empty::before {
  content: attr(data-placeholder);
  display: block;
  color: var(--brand-ink-3);
  pointer-events: none;
}
.editor-body:focus-visible {
  box-shadow: 0 0 0 2px var(--brand-ring);
  border-radius: 8px;
}

/* --- 图片卡片区 --- */
.image-cards {
  display: grid;
  gap: 18px;
  margin-top: 20px;
}
.image-card { margin: 0; }
.image-frame {
  position: relative;
  overflow: hidden;
  border-radius: var(--brand-radius-lg);
  background: var(--brand-muted);
}
.image-frame img {
  display: block;
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  border-radius: var(--brand-radius-lg);
  cursor: zoom-in;
  transition: transform 0.3s ease;
}
.image-frame img.rotate-90 { transform: rotate(90deg); }
.image-frame img.rotate-180 { transform: rotate(180deg); }
.image-frame img.rotate-270 { transform: rotate(270deg); }

/* --- 悬浮操作按钮（position:absolute + 明确偏移） --- */
.image-actions {
  position: absolute;
  top: 10px;

    for (var si = 0; si < savedList.length; si++) {
      if (savedList[si] && savedList[si].dateISO === opened.dateISO) { full = savedList[si]; break; }
    }
    if (full) {

      dateISO = full.dateISO;
      dateLabel = makeLabel(dateISO);

  backBtn.addEventListener('click', function () {
    showToast('已返回');
    setTimeout(function () { window.location.href = 'diary-list.html'; }, 350);
  });

  cancelBtn.addEventListener('click', function () { showToast('已取消'); });

  deleteBtn.addEventListener('click', function () {
    if (!window.confirm('确定删除这篇日记吗？删除后无法恢复。')) { return; }
    var kept = readEntries().filter(function (it) { return it && it.dateISO !== dateISO; });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(kept)); } catch (err) { /* ignore */ }
    showToast('日记已删除');
    setTimeout(function () { window.location.href = 'diary-list.html'; }, 600);
  });
})();
</script>
</body>
</html>
