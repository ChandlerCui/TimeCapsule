<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCapsule · 日记</title>
    <link rel="stylesheet" href="../css/theme.css">
    <style>
      /* --- 顶部应用栏 --- */
      .app-bar {
        position: sticky; top: 0; z-index: 50;
        background: color-mix(in srgb, var(--brand-card) 85%, transparent);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        backdrop-filter: blur(18px) saturate(180%);
        border-bottom: 1px solid var(--brand-border);
      }
      .app-bar-inner {
        max-width: 980px; margin: 0 auto; padding: 0 24px; height: 60px;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--brand-foreground); }
      .brand-badge {
        display: flex; align-items: center; justify-content: center;
        width: 34px; height: 34px; border-radius: 10px;
        background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent-blue));
        color: #fff; box-shadow: var(--brand-shadow-card);
      }
      .brand-badge svg { width: 18px; height: 18px; }
      .brand-name { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
      .btn-new {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 18px; border-radius: 999px;
        background: var(--brand-primary); color: #fff;
        font-size: 14px; font-weight: 600; line-height: 1.2; text-decoration: none;
        box-shadow: var(--brand-shadow-card);
        transition: background 0.3s ease, transform 0.2s ease;
      }
      .btn-new:hover { background: var(--brand-primary-hover); }
      .btn-new:active { transform: scale(0.96); }
      .btn-new svg { width: 16px; height: 16px; }

      /* --- 内容壳 --- */
      .shell { max-width: 980px; margin: 0 auto; padding: 0 24px 100px; }

      /* --- 页面标题 --- */
      .page-head { display: flex; flex-direction: column; gap: 6px; margin: 28px 0 20px; }
      .page-title { font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
      .page-sub { font-size: 14px; color: var(--brand-ink-2); }

      /* --- 工具条 --- */
      .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .search-box {
        flex: 1; display: flex; align-items: center; gap: 8px;
        height: 42px; padding: 0 14px;
        background: var(--brand-card); border: 1px solid var(--brand-border);
        border-radius: var(--brand-radius-md);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .search-box:hover { border-color: var(--brand-primary-soft-2); }
      .search-box:focus-within { border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-primary-soft); }
      .search-box svg { width: 16px; height: 16px; color: var(--brand-ink-3); flex-shrink: 0; }
      .search-box:focus-within svg { color: var(--brand-primary); }
      .search-box input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; color: var(--brand-foreground); }
      .search-box input::placeholder { color: var(--brand-ink-3); }
      .search-box input::-webkit-search-cancel-button { -webkit-appearance: none; }
      .search-hint { font-size: 13px; color: var(--brand-ink-2); margin: 0 0 14px; }

      /* --- 排序分段 --- */
      .seg { display: inline-flex; align-items: center; background: var(--brand-seg); border-radius: 999px; padding: 3px; }
      .seg-btn {
        border: 0; background: transparent; padding: 7px 16px; border-radius: 999px;
        font-size: 13px; font-weight: 500; line-height: 1.2; color: var(--brand-ink-2);
        cursor: pointer; transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
      }
      .seg-btn:hover { color: var(--brand-foreground); }
      .seg-btn:active { transform: scale(0.96); }
      .seg-btn.is-active { background: var(--brand-card); color: var(--brand-primary); font-weight: 600; box-shadow: var(--brand-shadow-card); }

      /* --- 日记分组 --- */
      .diary-group { margin-bottom: 24px; }
      .group-title {
        display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--brand-ink-2);
      }
      .group-title::before { content: ""; width: 3px; height: 14px; border-radius: 999px; background: var(--brand-primary); }
      .group-cards { display: flex; flex-direction: column; gap: 12px; }

      /* --- 日记卡片 --- */
      .entry-card {
        position: relative; display: flex; align-items: center; gap: 14px;
        padding: 14px; text-decoration: none; color: inherit;
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }
      .entry-card:hover { transform: translateY(-2px); border-color: var(--brand-primary-soft-2); box-shadow: var(--brand-shadow-soft); }
      .entry-card:active { transform: translateY(0); }
      .entry-thumb {
        flex-shrink: 0; width: 88px; height: 88px;
        border-radius: var(--brand-radius-md); overflow: hidden; background: var(--brand-muted);
      }
      .entry-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .entry-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
      .entry-title { font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--brand-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .entry-preview { font-size: 14px; line-height: 1.6; color: var(--brand-ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .entry-meta { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--brand-ink-2); }
      .meta-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 1.6; }
      .meta-pill svg { width: 12px; height: 12px; }
      .meta-pill.weather { background: var(--brand-primary-soft); color: var(--brand-primary); }
      .meta-pill.mood { background: var(--brand-accent-blue-soft); color: var(--brand-accent-blue); }
      .meta-pill.image { background: var(--brand-seg); color: var(--brand-ink-2); }
      .meta-pill.audio { background: var(--brand-accent-blue-soft); color: var(--brand-accent-blue); }
      .entry-arrow { flex-shrink: 0; display: flex; align-items: center; color: var(--brand-ink-3); }
      .entry-arrow svg { width: 18px; height: 18px; }

      /* --- 卡片删除按钮 --- */
      .entry-delete {
        position: absolute; top: 10px; right: 10px; z-index: 2;
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; padding: 0;
        border: 1px solid var(--brand-border); border-radius: 999px;
        background: var(--brand-card); color: var(--brand-ink-2);
        cursor: pointer; opacity: 0;
        transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
      }
      .entry-card:hover .entry-delete { opacity: 1; }
      .entry-delete:hover { background: rgba(229, 57, 53, 0.08); color: rgba(229, 57, 53, 1); border-color: rgba(229, 57, 53, 0.35); }
      .entry-delete svg { width: 15px; height: 15px; }

      /* --- 空状态 --- */
      .empty-state {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 48px 24px; text-align: center;
        background: var(--brand-card); border: 1px dashed var(--brand-border); border-radius: var(--brand-radius-lg);
      }
      .empty-icon { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: var(--brand-primary-soft); color: var(--brand-primary); margin-bottom: 6px; }
      .empty-icon svg { width: 26px; height: 26px; }
      .empty-title { font-size: 16px; font-weight: 600; line-height: 1.4; }
      .empty-desc { font-size: 13px; color: var(--brand-ink-2); }
      .btn-clear { margin-top: 6px; padding: 8px 18px; border: 0; border-radius: 999px; background: var(--brand-primary); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.3s ease, transform 0.2s ease; }
      .btn-clear:hover { background: var(--brand-primary-hover); }

      /* --- 页脚 --- */
      .page-footer { margin-top: 40px; padding: 20px 0 8px; border-top: 1px solid var(--brand-border); text-align: center; }
      .page-footer p { font-size: 13px; color: var(--brand-ink-3); }

      /* --- 响应式 --- */
      @media (max-width: 767.98px) {
        .app-bar-inner { padding: 0 16px; }
        .shell { padding: 0 16px 100px; }
        .page-title { font-size: 26px; }
        .page-head { margin: 22px 0 16px; }
        .toolbar { flex-direction: column; align-items: stretch; }
        .seg { align-self: flex-start; }
        .entry-thumb { width: 68px; height: 68px; }
        .entry-card { padding: 12px; gap: 12px; }
        .entry-delete { opacity: 1; top: 8px; right: 8px; width: 28px; height: 28px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .entry-card, .btn-new, .seg-btn, .btn-clear, .search-box { transition: none; }
        .entry-card:hover { transform: none; }
      }
    </style>
</head>
<body>
<main>
    <header class="app-bar">
        <div class="app-bar-inner">
            <a href="diary-list.html" class="brand" aria-label="TimeCapsule 首页">
                <span class="brand-badge"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>
                <span class="brand-name">TimeCapsule</span>
            </a>
            <a href="diary-editor.html?new=1" class="btn-new">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span>写日记</span>
            </a>
        </div>
    </header>

    <div class="shell">
        <section class="page-head">
            <h1 class="page-title">我的日记</h1>
            <p class="page-sub" id="list-subtitle">共 0 篇日记 · 最新优先</p>
        </section>

        <section class="toolbar" aria-label="搜索与排序">
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                <input id="search-input" type="search" placeholder="搜索日记内容…" autocomplete="off" aria-label="搜索日记内容">
            </div>
            <div class="seg" id="sort-control" role="group" aria-label="排序方式">
                <button type="button" class="seg-btn is-active" data-order="desc">最新优先</button>
                <button type="button" class="seg-btn" data-order="asc">最早优先</button>
            </div>
        </section>

        <p id="search-hint" class="search-hint is-hidden" aria-live="polite"></p>

        <section id="diary-list" class="diary-list" aria-label="日记列表"></section>

        <div id="list-empty-state" class="empty-state is-hidden" role="status">
            <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>
            <p class="empty-title">还没有日记</p>
            <p class="empty-desc">点击右上角"写日记"，记录你的第一篇时光胶囊</p>
        </div>

        <div id="search-empty-state" class="empty-state is-hidden" role="status">
            <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.5 8.5-5 5"/><path d="m8.5 8.5 5 5"/><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
            <p class="empty-title">没有找到相关日记</p>
            <p class="empty-desc">换个关键词试试，或者清空搜索看看全部日记</p>
            <button type="button" class="btn-clear" id="clear-search">清空搜索</button>
        </div>

        <footer class="page-footer">
            <p>© 2026 TimeCapsule · 记录每一个平凡瞬间</p>
        </footer>
    </div>

    <div id="tab-bar-mount"></div>
</main>
<script src="../js/app.js"></script>
<script>
(function () {
  'use strict';

  var list = document.getElementById('diary-list');
  var searchInput = document.getElementById('search-input');
  var searchHint = document.getElementById('search-hint');
  var emptyState = document.getElementById('search-empty-state');
  var listEmptyState = document.getElementById('list-empty-state');
  var clearBtn = document.getElementById('clear-search');
  var segBtns = document.querySelectorAll('#sort-control .seg-btn');
  var subtitle = document.getElementById('list-subtitle');
  var groups = [];
  var totalEntries = 0;

  /* 底部导航 */
  document.getElementById('tab-bar-mount').innerHTML = TC.tabBarHTML('list');

  var IMAGE_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>';
  var AUDIO_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>';
  var CHEVRON_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  var TRASH_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

  function renderEntries() {
    var all = TC.readEntries();
    all.sort(function (a, b) { return String(b.dateISO || '').localeCompare(String(a.dateISO || '')); });

    var groupMap = {};
    var groupOrder = [];
    all.forEach(function (e) {
      var d = String(e.dateISO || '').slice(0, 10) || '未知日期';
      if (!groupMap[d]) { groupMap[d] = []; groupOrder.push(d); }
      groupMap[d].push(e);
    });

    list.innerHTML = '';
    groupOrder.forEach(function (d) {
      var g = document.createElement('section');
      g.className = 'diary-group fade-in-up';
      g.setAttribute('data-date', d);
      var h = document.createElement('h2');
      h.className = 'group-title';
      h.textContent = TC.makeGroupTitle(d);
      var cards = document.createElement('div');
      cards.className = 'group-cards';
      groupMap[d].forEach(function (e) { cards.appendChild(buildCard(e)); });
      g.appendChild(h);
      g.appendChild(cards);
      list.appendChild(g);
    });

    groups = [];
    var groupEls = list.querySelectorAll('.diary-group');
    for (var i = 0; i < groupEls.length; i++) { groups.push(groupEls[i]); }
    totalEntries = list.querySelectorAll('.entry-card').length;

    if (subtitle) { subtitle.textContent = '共 ' + totalEntries + ' 篇日记 · 最新优先'; }
    if (listEmptyState) { listEmptyState.classList.toggle('is-hidden', totalEntries > 0); }
  }

  function buildCard(e) {
    var dateISO = String(e.dateISO || '');
    var preview = TC.plainText(e.body || '');
    var firstImg = (e.images && e.images.length && e.images[0].src) ? e.images[0].src : '';
    var hasAudio = e.audios && e.audios.length > 0;
    var mood = e.mood ? TC.MOOD_MAP[e.mood] : null;

    var html = '';
    html += '<a class="entry-card ios-card-raised" href="diary-editor.html" data-date="' + TC.escapeAttr(dateISO.slice(0, 10)) + '"';
    html += ' data-title="' + TC.escapeAttr(e.title || '') + '"';
    html += ' data-preview="' + TC.escapeAttr(preview) + '"';
    html += ' data-key="' + TC.escapeAttr(dateISO) + '">';
    if (firstImg) {
      html += '<div class="entry-thumb"><img src="' + TC.escapeAttr(firstImg) + '" alt="' + TC.escapeAttr(e.title || '') + '" loading="lazy"></div>';
    }
    html += '<div class="entry-body">';
    html += '<h3 class="entry-title">' + TC.escapeAttr(e.title || '') + '</h3>';
    html += '<p class="entry-preview">' + TC.escapeAttr(preview) + '</p>';
    html += '<div class="entry-meta">';
    if (dateISO.length >= 16) { html += '<span class="meta-time">' + TC.escapeAttr(dateISO.slice(11, 16)) + '</span>'; }
    html += '<span class="meta-pill weather">' + TC.weatherIcon(e.weather) + TC.escapeAttr(e.weather || '') + '</span>';
    if (mood) { html += '<span class="meta-pill mood">' + mood.emoji + TC.escapeAttr(mood.label) + '</span>'; }
    if (firstImg) { html += '<span class="meta-pill image">' + IMAGE_ICON + '图</span>'; }
    if (hasAudio) { html += '<span class="meta-pill audio">' + AUDIO_ICON + '录音</span>'; }
    html += '</div></div>';
    html += '<span class="entry-arrow">' + CHEVRON_ICON + '</span>';
    html += '<button type="button" class="entry-delete" data-action="delete-entry" title="删除日记" aria-label="删除日记">' + TRASH_ICON + '</button>';
    html += '</a>';

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    return wrap.firstChild;
  }

  /* 首次渲染 */
  renderEntries();

  /* 页面恢复时刷新 */
  window.addEventListener('pageshow', function () { renderEntries(); });

  /* 搜索 */
  function applySearch(raw) {
    var q = (raw || '').trim().toLowerCase();
    var cards = list.querySelectorAll('.entry-card');
    var matched = 0;
    var k, m;
    for (k = 0; k < cards.length; k++) {
      var title = (cards[k].getAttribute('data-title') || '').toLowerCase();
      var preview = (cards[k].getAttribute('data-preview') || '').toLowerCase();
      var hit = q === '' || title.indexOf(q) !== -1 || preview.indexOf(q) !== -1;
      cards[k].setAttribute('data-hidden', hit ? 'false' : 'true');
      if (hit) { matched++; }
    }
    for (k = 0; k < groups.length; k++) {
      var visibleInGroup = false;
      var groupCards = groups[k].querySelectorAll('.entry-card');
      for (m = 0; m < groupCards.length; m++) {
        if (groupCards[m].getAttribute('data-hidden') !== 'true') { visibleInGroup = true; break; }
      }
      groups[k].setAttribute('data-hidden', visibleInGroup ? 'false' : 'true');
    }
    if (raw && raw.trim() !== '') {
      if (matched === 0) {
        searchHint.classList.add('is-hidden');
        emptyState.classList.remove('is-hidden');
      } else {
        emptyState.classList.add('is-hidden');
        searchHint.classList.remove('is-hidden');
        searchHint.textContent = '已找到 ' + matched + ' 篇包含「' + raw.trim() + '」的日记';
      }
    } else {
      searchHint.classList.add('is-hidden');
      emptyState.classList.add('is-hidden');
    }
  }

  searchInput.addEventListener('input', function () { applySearch(this.value); });

  clearBtn.addEventListener('click', function () {
    searchInput.value = '';
    applySearch('');
    searchInput.focus();
    TC.showToast('已清空搜索条件');
  });

  /* 排序 */
  function sortGroups(order) {
    var sorted = groups.slice();
    sorted.sort(function (a, b) {
      var da = a.getAttribute('data-date') || '';
      var db = b.getAttribute('data-date') || '';
      var r = da < db ? -1 : (da > db ? 1 : 0);
      return order === 'asc' ? r : -r;
    });
    for (var k = 0; k < sorted.length; k++) { list.appendChild(sorted[k]); }
    if (subtitle) { subtitle.textContent = '共 ' + totalEntries + ' 篇日记 · ' + (order === 'asc' ? '最早优先' : '最新优先'); }
  }

  for (var i = 0; i < segBtns.length; i++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('is-active')) { return; }
        var order = btn.getAttribute('data-order') || 'desc';
        for (var j = 0; j < segBtns.length; j++) { segBtns[j].classList.remove('is-active'); }
        btn.classList.add('is-active');
        sortGroups(order);
      });
    })(segBtns[i]);
  }

  /* 卡片点击与删除 */
  function closestCard(node) {
    while (node && node !== document) {
      if (node.getAttribute && node.getAttribute('data-key')) { return node; }
      node = node.parentNode;
    }
    return null;
  }

  list.addEventListener('click', function (e) {
    var delBtn = e.target && e.target.closest ? e.target.closest('[data-action="delete-entry"]') : null;
    if (delBtn && list.contains(delBtn)) {
      e.preventDefault();
      e.stopPropagation();
      var delCard = delBtn.closest('.entry-card');
      var delKey = delCard ? delCard.getAttribute('data-key') : '';
      if (!delKey) { return; }
      if (!window.confirm('确定删除这篇日记吗？删除后无法恢复。')) { return; }
      TC.deleteEntry(delKey);
      TC.showToast('日记已删除');
      renderEntries();
      return;
    }
    var card = closestCard(e.target);
    if (!card) { return; }
    if (e.metaKey || e.ctrlKey || e.shiftKey) { return; }
    e.preventDefault();
    var key = card.getAttribute('data-key') || '';
    if (key) {
      try { sessionStorage.setItem('timecapsule:opened-entry', JSON.stringify({ dateISO: key })); } catch (err) { /* ignore */ }
    }
    window.location.href = card.getAttribute('href') || 'diary-editor.html';
  });
})();
</script>
</body>
</html>
